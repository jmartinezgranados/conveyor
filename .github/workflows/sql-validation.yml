name: SQL Validation and Deployment

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'scripts/sql/**'
      - 'deployment/**'
      - '.github/workflows/sql-validation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'scripts/sql/**'

env:
  PYTHON_VERSION: '3.10'

jobs:
  lint-sql:
    name: Lint SQL Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sqlfluff sqlparse

      - name: Lint SQL files
        run: |
          sqlfluff lint scripts/sql/ --dialect databricks

  execute-sql:
    name: Execute SQL Scripts
    runs-on: ubuntu-latest
    needs: lint-sql
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install databricks-sdk requests python-dotenv

      - name: Execute SQL migrations
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          WAREHOUSE_ID: ${{ vars.WAREHOUSE_ID }}
          CATALOG: ${{ vars.CATALOG }}
        run: |
          cd deployment
          python sql_executor.py ../scripts/sql/migrations/ \
            --warehouse-id "$WAREHOUSE_ID" \
            --catalog "$CATALOG" \
            --pattern "V*.sql"

  post-deployment-tests:
    name: Post-Deployment Tests (Soda)
    runs-on: ubuntu-latest
    needs: execute-sql
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Soda Core
        run: |
          pip install --upgrade pip
          pip install soda-core-spark databricks-sql-connector setuptools

      - name: Run Soda Scan
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          WAREHOUSE_ID: ${{ vars.WAREHOUSE_ID }}
          CATALOG: ${{ vars.CATALOG }}
          SCHEMA: ${{ vars.SCHEMA }}
        run: |
          soda scan -d databricks -c soda/configuration.yml soda/checks/
