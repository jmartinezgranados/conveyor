name: Code Validation

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'scripts/**'
      - 'deployment/**'
      - 'tests/**'
      - '.github/workflows/sql-validation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'scripts/**'
      - 'deployment/**'
      - 'tests/**'

env:
  PYTHON_VERSION: '3.10'

jobs:
  lint-sql:
    name: Lint SQL Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sqlfluff
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sqlfluff sqlparse

      - name: Lint SQL files
        run: |
          sqlfluff lint scripts/sql/ --dialect databricks
