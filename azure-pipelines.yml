trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    include:
      - scripts/sql/**
      - deployment/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - scripts/sql/**

variables:
  pythonVersion: '3.10'

stages:
  - stage: Validate
    displayName: 'Validation Stage'
    jobs:
      - job: LintSQL
        displayName: 'Lint SQL Scripts'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              pip install sqlfluff sqlparse
            displayName: 'Install SQL linting tools'

          - script: |
              sqlfluff lint scripts/sql/ --dialect databricks
            displayName: 'Run SQLFluff'

  - stage: Deploy
    displayName: 'Execute SQL Scripts'
    dependsOn: Validate
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/main'))
    jobs:
      - deployment: ExecuteSQL
        displayName: 'Execute SQL Migrations'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'development'
        variables:
          - group: databricks-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'

                - script: |
                    pip install databricks-sdk requests python-dotenv
                  displayName: 'Install dependencies'

                - script: |
                    cd deployment
                    python sql_executor.py ../scripts/sql/migrations/ \
                      --warehouse-id $(WAREHOUSE_ID) \
                      --catalog $(CATALOG) \
                      --pattern "V*.sql"
                  displayName: 'Execute SQL migrations'
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                    WAREHOUSE_ID: $(WAREHOUSE_ID)
                    CATALOG: $(CATALOG)
