trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    include:
      - scripts/sql/**
      - deployment/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - scripts/sql/**

variables:
  pythonVersion: '3.10'

stages:
  - stage: Validate
    displayName: 'Validation Stage'
    jobs:
      - job: LintSQL
        displayName: 'Lint SQL Scripts'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              pip install sqlfluff sqlparse
            displayName: 'Install SQL linting tools'

          - script: |
              sqlfluff lint scripts/sql/ --dialect databricks
            displayName: 'Run SQLFluff'

  - stage: Deploy
    displayName: 'Execute SQL Scripts'
    dependsOn: Validate
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/main'))
    jobs:
      - deployment: ExecuteSQL
        displayName: 'Execute SQL Migrations'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'development'
        variables:
          - group: databricks-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'

                - script: |
                    pip install databricks-sdk requests python-dotenv
                  displayName: 'Install dependencies'

                - script: |
                    cd deployment
                    python sql_executor.py ../scripts/sql/migrations/ \
                      --warehouse-id $(WAREHOUSE_ID) \
                      --catalog $(CATALOG) \
                      --pattern "V*.sql"
                  displayName: 'Execute SQL migrations'
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                    WAREHOUSE_ID: $(WAREHOUSE_ID)
                    CATALOG: $(CATALOG)

  - stage: PostDeploymentTests
    displayName: 'Post-Deployment Tests'
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: SodaTests
        displayName: 'Run Soda Data Quality Checks'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          - group: databricks-dev
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'

          - script: |
              pip install soda-core-spark databricks-sql-connector setuptools
            displayName: 'Install Soda Core'

          - script: |
              soda scan -d databricks -c soda/configuration.yml soda/checks/ 2>&1 | tee soda-output.txt
              exit ${PIPESTATUS[0]}
            displayName: 'Run Soda data quality checks'
            continueOnError: true
            name: sodaScan
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
              WAREHOUSE_ID: $(WAREHOUSE_ID)
              CATALOG: $(CATALOG)
              SCHEMA: $(SCHEMA)

          - script: |
              curl -X POST \
                -u ":$(System.AccessToken)" \
                -H "Content-Type: application/json-patch+json" \
                "$(System.CollectionUri)$(System.TeamProject)/_apis/wit/workitems/\$Bug?api-version=7.0" \
                -d '[
                  {"op": "add", "path": "/fields/System.Title", "value": "Data Quality Check Failed - $(Build.BuildNumber)"},
                  {"op": "add", "path": "/fields/System.Description", "value": "Data quality checks failed in build $(Build.BuildNumber) on branch $(Build.SourceBranchName).<br><br>Pipeline: $(Build.DefinitionName)<br>Commit: $(Build.SourceVersion)<br><br>Please review the Soda scan results and fix the data quality issues."},
                  {"op": "add", "path": "/fields/System.AssignedTo", "value": "$(Build.RequestedFor)"}
                ]'
            displayName: 'Create Work Item on Soda Failure'
            condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
